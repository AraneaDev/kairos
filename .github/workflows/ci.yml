name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # A release-please pull request's diff is version files plus a changelog
      # entry; the code underneath is byte-identical to the main it was cut
      # from, which already passed this suite. Installing jq and running the
      # tests here re-verifies code that hasn't changed, so those steps are
      # skipped on that branch. The job itself still runs and still reports
      # success, because `test (ubuntu-latest)` and friends are required
      # checks and a job that never reports would leave the PR permanently
      # blocked. The guard is keyed on the branch name release-please owns.
      - name: Install jq
        if: github.head_ref != 'release-please--branches--main'
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq $(jq --version) already present"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install jq
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install jq -y
          else
            sudo apt-get update && sudo apt-get install -y jq
          fi
      - name: Run tests
        if: github.head_ref != 'release-please--branches--main'
        run: bash tests/run.sh
      - name: Run tests under bash 3.2
        if: runner.os == 'macOS' && github.head_ref != 'release-please--branches--main'
        run: /bin/bash tests/run.sh

  commit-style:
    # release-please reads the subject that lands on main to build the changelog
    # and choose the next version. This repository squash merges, so that
    # subject is the pull request title rather than any commit inside the
    # branch, and the title is what has to be checked. The commits are checked
    # too, so a branch that is rebased onto main instead is covered as well.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          # Through the environment, not interpolated into the script: a title
          # is attacker controlled text on a public repository.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash tools/check-commit-style.sh "$PR_TITLE"
      - name: Check every commit on the branch
        if: github.event_name == 'pull_request'
        run: |
          status=0
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            bash tools/check-commit-style.sh "$subject" || status=1
          done < <(git log --format='%s' "$base..$head")
          exit "$status"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: |
          for f in hooks/scripts/*.sh hooks/scripts/lib/*.sh tools/*.sh tests/run.sh \
                   .githooks/pre-commit .githooks/pre-push .githooks/commit-msg; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done
      - name: shellcheck
        run: |
          shellcheck -S style -e SC1091 \
            --enable=deprecate-which \
            --enable=avoid-nullary-conditions \
            --enable=quote-safe-variables \
            hooks/scripts/*.sh hooks/scripts/lib/*.sh tools/*.sh tests/run.sh \
            .githooks/pre-commit .githooks/pre-push .githooks/commit-msg

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)
      - name: Validate JSON
        run: |
          for f in .claude-plugin/plugin.json hooks/hooks.json \
                   release-please-config.json .release-please-manifest.json; do
            jq -e . "$f" > /dev/null && echo "$f ok"
          done
      - name: Hook commands point at files that exist
        run: |
          status=0
          while read -r script; do
            path="${script#\$CLAUDE_PLUGIN_ROOT/}"
            if [ -f "$path" ]; then echo "ok   $path"; else echo "MISSING $path"; status=1; fi
          done < <(jq -r '.hooks[][].hooks[].command | scan("\\$CLAUDE_PLUGIN_ROOT/[^\"]+")' hooks/hooks.json)
          exit $status

  docs:
    # The README goes stale silently: a setting gets added and never written
    # down, a count stops matching. All cheap to check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)
      - name: Check the README against the code
        run: bash tools/check-docs.sh

  screenshots:
    # The README's images are captures of real Claude Code sessions, and they go
    # stale the same silent way the prose does. Checking them needs neither
    # Claude nor a network: the captures are committed, so this re-renders the
    # images from them and confirms the captures still show what the code
    # prints. Taking a new capture is a local job, tools/screenshot.sh --capture.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)
      - name: Check the screenshots against the code
        run: bash tools/screenshot.sh --check
